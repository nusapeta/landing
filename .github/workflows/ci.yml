name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: python3 scripts/check.py

  image:
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: landing:ci
          platforms: linux/amd64

      - name: Smoke test the built image
        run: |
          set -eu
          docker run -d --name lp -p 8097:8080 landing:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8097/healthz >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:8097/healthz)" = ok
          curl -fsS http://127.0.0.1:8097/ | grep -q '<title>Nusapeta'
          curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8097/styles.css | grep -q 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8097/does-not-exist)" = 404
          curl -sI http://127.0.0.1:8097/ | grep -qi 'x-content-type-options: nosniff'
          curl -sI http://127.0.0.1:8097/assets/logo-lockup.png | grep -qi 'immutable'
          docker logs lp
          docker rm -f lp

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nusapeta/landing
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Publish multi-arch image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
